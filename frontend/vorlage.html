<!DOCTYPE html>
<!--
  LaserFlow – VORLAGE FÜR NEUE SEITEN
  1. Datei kopieren und umbenennen (z. B. warenkorb.html).
  2. SEITENTITEL ersetzen.
  3. Eigene Inhalte nur innerhalb von <main> schreiben.
  4. Kopfbereich, Fußbereich und die gemeinsamen CSS/JS-Dateien NICHT verändern.
  5. Seiteneigene Styles in css/<seite>.css, eigenes Verhalten in js/<seite>.js.
  Regeln: docs/design.md
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEITENTITEL – LaserFlow</title>

  <!-- Gemeinsam für jede Seite: Schriften, Design, Layout, Bausteine, Verhalten (siehe docs/design.md) -->
  <link rel="icon" href="img/logo/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/logo/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/layout.js" defer></script>

  <!-- Nur für diese Seite (bei Bedarf einkommentieren) -->
  <!-- <link rel="stylesheet" href="css/SEITE.css"> -->
  <!-- <script src="js/SEITE.js" defer></script> -->
</head>
<body>

  <!-- Kopfbereich: wird beim Scrollen kompakter (Klasse "is-scrolled" setzt layout.js) -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="LaserFlow – zur Startseite">
        <svg class="logo-mark" viewBox="2 16 96 96" aria-hidden="true">
          <defs><linearGradient id="logo-beam-kopf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset="1" stop-color="currentColor"/></linearGradient></defs>
          <rect class="logo-beam" x="47.5" y="4" width="5" height="54" rx="2.5" fill="url(#logo-beam-kopf)"/>
          <circle class="logo-core" cx="50" cy="64" r="7"/>
          <circle class="logo-ring logo-ring-1" cx="50" cy="64" r="16"/>
          <circle class="logo-ring logo-ring-2" cx="50" cy="64" r="26"/>
          <circle class="logo-ring logo-ring-3" cx="50" cy="64" r="35"/>
        </svg>
        <span class="logo-text">Laser<span class="logo-accent">Flow</span></span>
      </a>

      <nav class="nav" aria-label="Hauptnavigation">
        <a href="index.html#ueber-uns">Über uns</a>
        <a href="index.html#produkte">Produkte</a>
        <a href="index.html#so-gehts">So funktioniert's</a>
        <a href="index.html#kontakt">Kontakt</a>
      </nav>

      <div class="header-actions">
        <!-- Benutzer-Icon mit Menü: Inhalt hängt davon ab, ob man angemeldet ist (siehe layout.js) -->
        <div class="user-menu">
          <button class="icon-button" id="user-button" aria-haspopup="true" aria-expanded="false" aria-label="Benutzerkonto">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
            </svg>
          </button>
          <div class="dropdown" id="user-dropdown" role="menu">
            <!-- wird von layout.js befüllt -->
          </div>
        </div>

        <!-- Warenkorb-Icon mit Anzahl -->
        <a href="#" class="icon-button cart" aria-label="Warenkorb">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 7h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7z"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
          </svg>
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <main>

    <!-- Beispiel-Abschnitt: so sieht ein normaler Inhaltsbereich aus -->
    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">Bereich</p>
          <h2>Überschrift der Seite</h2>
          <p class="section-intro">Kurzer einleitender Satz.</p>
        </div>

        <!-- Hier kommen die Inhalte der Seite hin, z. B. Kacheln, Formulare, Tabellen -->

      </div>
    </section>

  </main>

  <!-- Fußbereich: rechtliche Links und Copyright -->
  <footer class="footer">
    <div class="container footer-inner">
      <a href="index.html" class="logo logo-small" aria-label="LaserFlow – zur Startseite">
        <svg class="logo-mark" viewBox="2 16 96 96" aria-hidden="true">
          <defs><linearGradient id="logo-beam-fuss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset="1" stop-color="currentColor"/></linearGradient></defs>
          <rect class="logo-beam" x="47.5" y="4" width="5" height="54" rx="2.5" fill="url(#logo-beam-fuss)"/>
          <circle class="logo-core" cx="50" cy="64" r="7"/>
          <circle class="logo-ring logo-ring-1" cx="50" cy="64" r="16"/>
          <circle class="logo-ring logo-ring-2" cx="50" cy="64" r="26"/>
          <circle class="logo-ring logo-ring-3" cx="50" cy="64" r="35"/>
        </svg>
        <span class="logo-text">Laser<span class="logo-accent">Flow</span></span>
      </a>
      <nav class="footer-links" aria-label="Rechtliches">
        <a href="#">Impressum</a>
        <a href="#">Datenschutz</a>
        <a href="#">AGB</a>
        <a href="#">Versand</a>
        <a href="index.html#kontakt">Kontakt</a>
      </nav>
      <p>© 2026 LaserFlow – Abschlussprojekt</p>
    </div>
  </footer>

</body>
</html>
