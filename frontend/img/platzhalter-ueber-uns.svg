<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Platzhalterbild für "Über uns" – später durch ein echtes Foto ersetzen -->
  <rect width="800" height="600" fill="#2f2c29"/>
  <g fill="none" stroke="#97ffff" stroke-width="2" opacity="0.35">
    <circle cx="400" cy="270" r="120"/>
    <circle cx="400" cy="270" r="90"/>
    <circle cx="400" cy="270" r="60"/>
    <circle cx="400" cy="270" r="30"/>
  </g>
  <line x1="400" y1="40" x2="400" y2="270" stroke="#97ffff" stroke-width="3"/>
  <circle cx="400" cy="270" r="6" fill="#97ffff"/>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#f1ece6">Platzhalter</text>
  <text x="400" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#b3aaa0">Hier kommt später ein Teamfoto hin</text>
